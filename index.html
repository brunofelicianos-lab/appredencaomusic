<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redenção Music — Cifras e Repertório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0f;
    --bg-glow: radial-gradient(1100px 520px at 12% -8%, rgba(231,179,76,0.14), transparent 60%),
               radial-gradient(900px 480px at 100% 0%, rgba(110,168,254,0.10), transparent 55%);
    --panel:#14161d;
    --panel2:#1b1e27;
    --panel3:#20242f;
    --border:#262a35;
    --border-soft:#1e222b;
    --text:#f1f2f5;
    --muted:#9198a6;
    --muted-soft:#6b7280;
    --accent:#eab654;
    --accent-dim:#8a6a2c;
    --accent2:#6ea8fe;
    --gui:#eab654;
    --nica:#6ea8fe;
    --mila:#f2879a;
    --manu:#6fd6ac;
    --rafa:#c79cf0;
    --nika:#6ea8fe;
    --todos:#9198a6;
    --radius:16px;
    --shadow: 0 8px 24px -12px rgba(0,0,0,0.5);
    --shadow-lg: 0 16px 40px -14px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  ::selection{ background:rgba(234,182,84,0.35); color:#fff; }
  html{ scrollbar-color: #3a3f4c transparent; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#2c313d; border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:#3a3f4c; }
  body{
    margin:0;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--bg);
    background-image:var(--bg-glow);
    background-attachment:fixed;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(180deg, rgba(10,11,15,0.98), rgba(10,11,15,0.88));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:20px 20px 16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .brand-icon{
    width:42px; height:42px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.25rem;
    background:linear-gradient(140deg, #eab654, #c9852f);
    box-shadow:0 6px 16px -4px rgba(234,182,84,0.45);
    flex-shrink:0;
  }
  header h1{
    margin:0;
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:-.2px;
    background:linear-gradient(120deg,#fff,#c9cdd6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header .sub{
    color:var(--muted);
    font-size:.83rem;
    margin-top:1px;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .tab-btn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--muted);
    padding:9px 15px;
    border-radius:12px;
    font-size:.85rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
    flex:1 1 auto;
    text-align:center;
  }
  @media (max-width:480px){
    .tab-btn{ padding:8px 10px; font-size:.76rem; flex-basis:30%; }
  }
  .tab-btn:hover{ border-color:#3a4050; color:var(--text); }
  .tab-btn.active{
    color:#1a1305;
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 4px 14px -4px rgba(234,182,84,0.5);
  }
  .view{ display:none; }
  .view.active{ display:block; }
  .reading-opts{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .reading-opts .chip.active{
    color:#0d2016;
    background:var(--accent2);
    border-color:var(--accent2);
    box-shadow:0 4px 14px -4px rgba(110,168,254,0.5);
  }
  .font-ctrl{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-size:.78rem;
    font-weight:600;
  }
  .font-ctrl button{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    width:30px; height:30px;
    border-radius:9px;
    font-size:.78rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:all .15s ease;
  }
  .font-ctrl button:hover{ border-color:#3a4050; background:var(--panel); }
  .proximas-intro{
    color:var(--muted);
    font-size:.85rem;
    background:var(--panel2);
    border:1px solid var(--border-soft);
    border-radius:12px;
    padding:12px 14px;
    margin:14px 0 10px;
  }
  .searchbar{
    position:relative;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  input[type="search"]{
    flex:1 1 220px;
    background:var(--panel2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%239198a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat 14px center;
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 14px 11px 40px;
    border-radius:12px;
    font-size:.95rem;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="search"]::placeholder{ color:var(--muted-soft); }
  input[type="search"]:focus{
    border-color:var(--accent2);
    box-shadow:0 0 0 3px rgba(110,168,254,0.15);
  }
  .filters{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .chip{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--muted);
    padding:7px 13px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip:hover{ border-color:#3a4050; color:var(--text); }
  .chip.active{
    color:#1a1305;
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 4px 14px -4px rgba(234,182,84,0.5);
  }
  .sort-chip{
    display:inline-block;
    margin:2px 0 12px;
  }
  .sort-chip.active{
    color:#0d2016;
    background:var(--accent2);
    border-color:var(--accent2);
    box-shadow:0 4px 14px -4px rgba(110,168,254,0.5);
  }
  main{
    max-width:880px;
    margin:0 auto;
    padding:18px 16px 70px;
  }
  .count{
    color:var(--muted-soft);
    font-size:.78rem;
    margin:4px 6px 16px;
    letter-spacing:.1px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
    transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .card:hover{
    border-color:#31374350;
    box-shadow:var(--shadow);
  }
  .card.open{
    border-color:#333a48;
    box-shadow:var(--shadow-lg);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 16px;
    cursor:pointer;
  }
  .num{
    color:var(--muted-soft);
    font-size:.72rem;
    font-weight:600;
    width:26px; height:26px;
    border-radius:9px;
    background:var(--panel3);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .title{
    flex:1;
    font-weight:700;
    font-size:.96rem;
    letter-spacing:-.1px;
    min-width:0;
  }
  .title .note{
    display:block;
    font-weight:500;
    color:var(--muted-soft);
    font-size:.73rem;
    margin-top:2px;
  }
  .uv{
    display:block;
    font-weight:600;
    font-size:.71rem;
    margin-top:3px;
    letter-spacing:.1px;
  }
  .uv-recente{ color:#f2877e; }
  .uv-morno{ color:#e8c169; }
  .uv-seguro{ color:#6fbf8f; }
  .uv-desconhecido{ color:var(--muted-soft); }
  .badge{
    font-size:.7rem;
    font-weight:700;
    padding:4px 10px 4px 8px;
    border-radius:999px;
    background:rgba(255,255,255,0.05);
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:5px;
    letter-spacing:.2px;
  }
  .badge .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:currentColor;
    box-shadow:0 0 6px currentColor;
  }
  .badge.GUI{color:var(--gui);}
  .badge.NICA,.badge.NIKA{color:var(--nica);}
  .badge.MILA{color:var(--mila);}
  .badge.MANU{color:var(--manu);}
  .badge.RAFA{color:var(--rafa);}
  .badge.TODOS,.badge.OUTROS{color:var(--todos);}
  .tom{
    font-size:.71rem;
    color:#1a1305;
    background:linear-gradient(140deg, #f2c874, #dfa53f);
    padding:4px 10px;
    border-radius:999px;
    font-weight:800;
    flex-shrink:0;
    letter-spacing:.2px;
  }
  .chevron{
    color:var(--muted-soft);
    transition:transform .2s ease;
    flex-shrink:0;
    font-size:1.1rem;
  }
  .card.open .chevron{ transform:rotate(90deg); color:var(--accent2); }
  .card-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1);
  }
  .card.open .card-body{ grid-template-rows:1fr; }
  .card-body-inner{
    overflow:hidden;
    min-height:0;
  }
  .card-body-inner > .body-pad{
    padding:2px 16px 18px;
    border-top:1px solid var(--border-soft);
  }
  .meta-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin:14px 0 10px;
    font-size:.81rem;
    color:var(--muted);
  }
  .meta-row b{ color:var(--text); font-weight:600; }
  .mod-row{
    background:rgba(234,182,84,0.07);
    border:1px solid rgba(234,182,84,0.18);
    border-radius:10px;
    padding:9px 12px;
    font-size:.79rem;
    color:#e2c88d;
    margin:2px 0 10px;
    line-height:1.45;
  }
  .cifra{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    overflow-x:auto;
    white-space:pre;
    font-family:'JetBrains Mono',"SF Mono",Menlo,Consolas,monospace;
    font-size:var(--cifra-fs, .82rem);
    line-height:1.65;
    color:#c6cbd6;
  }
  .cifra .line{ white-space:pre; }
  .cifra .chord{ color:var(--accent); font-weight:700; }
  .cifra .section-label{ color:var(--accent2); font-weight:700; }
  body.hide-chords .cifra .chord-line,
  body.hide-chords .cifra .chord-part{ display:none; }
  .placeholder{
    color:var(--muted-soft);
    font-size:.84rem;
    font-style:italic;
    padding:14px 0 8px;
  }
  .source{
    display:inline-flex;
    align-items:center;
    gap:4px;
    margin-top:12px;
    font-size:.78rem;
    font-weight:600;
    color:var(--accent2);
    text-decoration:none;
  }
  .source:hover{ text-decoration:underline; }
  .transpose{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin:2px 0 14px;
    font-size:.79rem;
    color:var(--muted);
    background:var(--panel3);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 10px;
    width:fit-content;
    max-width:100%;
  }
  .transpose button{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    font-size:1rem;
    font-family:inherit;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .transpose button:hover{ border-color:var(--accent2); color:var(--accent2); transform:translateY(-1px); }
  .transpose button:active{ transform:translateY(0); }
  .transpose .tr-tom{
    color:var(--text);
    font-weight:800;
    min-width:32px;
    text-align:center;
    font-size:.8rem;
    white-space:nowrap;
  }
  .transpose .tr-reset{
    width:auto;
    height:auto;
    padding:6px 12px;
    border-radius:999px;
    font-size:.71rem;
    font-weight:600;
    font-family:inherit;
  }
  .tr-fs{
    width:auto;
    height:auto;
    padding:6px 12px;
    border-radius:999px;
    font-size:.71rem;
    font-weight:700;
    font-family:inherit;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--accent2);
    cursor:pointer;
    margin-left:auto;
    transition:all .15s ease;
  }
  .tr-fs:hover{ border-color:var(--accent2); background:rgba(110,168,254,0.1); }
  .fs-overlay{
    position:fixed;
    inset:0;
    z-index:999;
    background-color:var(--bg);
    background-image:var(--bg-glow);
    display:none;
    flex-direction:column;
  }
  .fs-overlay.active{ display:flex; }
  .fs-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:16px 18px;
    border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg, rgba(10,11,15,0.98), rgba(10,11,15,0.88));
    backdrop-filter: blur(10px);
    flex-wrap:wrap;
  }
  .fs-title{
    font-size:1.15rem;
    font-weight:800;
    color:var(--text);
  }
  .fs-sub{
    color:var(--accent);
    font-weight:700;
    font-size:.9rem;
    margin-top:2px;
  }
  .fs-controls{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .fs-sep{
    width:1px;
    height:20px;
    background:var(--border);
    margin:0 4px;
  }
  .fs-btn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    width:36px; height:36px;
    border-radius:10px;
    font-size:.85rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:all .15s ease;
  }
  .fs-btn:hover{ border-color:#3a4050; background:var(--panel); }
  .fs-close{ color:#ff8a8a; border-color:rgba(255,138,138,0.3); }
  .fs-close:hover{ background:rgba(255,138,138,0.1); }
  .fs-body{
    flex:1;
    overflow:auto;
    padding:20px;
  }
  .fs-body .cifra{
    max-width:900px;
    margin:0 auto;
    font-size:var(--fs-cifra-fs, 1.15rem);
    line-height:1.8;
  }
  .empty-state{
    text-align:center;
    color:var(--muted-soft);
    padding:50px 20px;
    font-size:.9rem;
  }
  .semana:empty{ display:none; }
  .semana-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:12px;
    background:linear-gradient(135deg, rgba(234,182,84,0.16), rgba(110,168,254,0.08));
    border:1px solid rgba(234,182,84,0.28);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .semana-title{
    font-weight:800;
    font-size:1rem;
    letter-spacing:-.1px;
  }
  .semana-date{
    color:var(--muted);
    font-size:.82rem;
    margin-top:3px;
  }
  .semana-escalados{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:flex-start;
  }
  .semana-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:26px;
  }
  .semana-tbd{
    border:1px dashed var(--border);
    border-radius:var(--radius);
    padding:18px;
    text-align:center;
    color:var(--muted-soft);
    font-size:.85rem;
    font-style:italic;
  }
  .yt-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,60,60,0.1);
    border:1px solid rgba(255,90,90,0.32);
    color:#ff8f8f;
    padding:7px 13px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:700;
    text-decoration:none;
    margin:14px 0 2px;
  }
  .yt-link:hover{ background:rgba(255,60,60,0.18); }
  footer{
    text-align:center;
    color:var(--muted-soft);
    font-size:.72rem;
    line-height:1.7;
    padding:26px 20px 34px;
    border-top:1px solid var(--border-soft);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">🎸</div>
    <div>
      <h1>Redenção Music</h1>
      <div class="sub">Cifras, tons e repertório da banda</div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab-btn" data-tab="musicas">Músicas</button>
    <button class="tab-btn active" data-tab="semana">Repertório da Semana</button>
    <button class="tab-btn" data-tab="proximas">Próximas Músicas</button>
  </nav>
  <div class="reading-opts" id="readingOpts">
    <button class="chip" id="toggleChordsBtn">🎼 Ocultar cifras</button>
    <div class="font-ctrl">
      <span>Fonte</span>
      <button id="fontDec" title="Diminuir fonte">A−</button>
      <button id="fontInc" title="Aumentar fonte">A+</button>
    </div>
  </div>
  <div class="searchbar" id="searchbar" style="display:none;">
    <input type="search" id="search" placeholder="Buscar música ou quem canta...">
  </div>
  <div class="filters" id="filters" style="display:none;"></div>
</header>

<main>
  <section id="view-musicas" class="view">
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>

  <section id="view-semana" class="view active">
    <section class="semana" id="semana"></section>
  </section>

  <section id="view-proximas" class="view">
    <div class="proximas-intro">🆕 Músicas novas que a banda vai aprender e lançar em breve.</div>
    <div class="count" id="count-proximas"></div>
    <div id="list-proximas"></div>
  </section>
</main>

<footer>
  Cifras e tons de referência — confira com quem canta antes do ensaio, pois o tom pode variar por voz.<br>
  Repertório completo importado da planilha da banda · atualizado manualmente
</footer>

<div class="fs-overlay" id="fsOverlay">
  <div class="fs-header">
    <div>
      <div class="fs-title" id="fsTitle"></div>
      <div class="fs-sub" id="fsSub"></div>
    </div>
    <div class="fs-controls">
      <button class="fs-btn" id="fsTrDec" title="Descer meio tom">–</button>
      <button class="fs-btn" id="fsTrInc" title="Subir meio tom">+</button>
      <span class="fs-sep"></span>
      <button class="fs-btn" id="fsFontDec" title="Diminuir fonte">A−</button>
      <button class="fs-btn" id="fsFontInc" title="Aumentar fonte">A+</button>
      <button class="fs-btn fs-close" id="fsClose" title="Fechar tela cheia">✕</button>
    </div>
  </div>
  <div class="fs-body">
    <div class="cifra" id="fsCifra"></div>
  </div>
</div>

<script>
// ---------- DADOS ----------
// Músicas com cifra completa (lote inicial de validação)
const CIFRAS = {

    fonte: "https://www.cifraclub.com.br/purples/reinas/",
    fonteNome: "Purples — Cifra Club",
    compositor: "Julio Cesar Filho",
    cifra:
`[Intro] Gm  F  Eb9

function normalize(str){
  return (str||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
}

function vozClass(voz){
  const v = (voz||"").toUpperCase();
  if(v.includes("GUI")) return "GUI";
  if(v.includes("NICA")||v.includes("NIKA")) return "NICA";
  if(v.includes("MILA")) return "MILA";
  if(v.includes("MANU")) return "MANU";
  if(v.includes("RAFA")) return "RAFA";
  if(v.includes("TODOS")) return "TODOS";
  return "OUTROS";
}

// ---------- ÚLTIMA VEZ TOCADA (histórico do WhatsApp) ----------
function parseBrDate(str){
  const [dd,mm,yyyy] = str.split('/').map(Number);
  return new Date(yyyy, mm-1, dd);
}

// Acha a data mais recente em que "title" foi tocada, com correspondência exata
// e, se não achar, por aproximação (ignorando acentos/maiúsculas).
function getUltimaVez(title){
  if(ULTIMA_VEZ_TOCADA[title]) return ULTIMA_VEZ_TOCADA[title];
  const nt = normalize(title);
  let best = null;
  for(const k in ULTIMA_VEZ_TOCADA){
    const nk = normalize(k);
    if(nk===nt || nk.includes(nt) || nt.includes(nk)){
      const d = ULTIMA_VEZ_TOCADA[k];
      if(!best || parseBrDate(d) > parseBrDate(best)) best = d;
    }
  }
  return best;
}

function ultimaVezInfo(title){
  const data = getUltimaVez(title);
  if(!data) return { data:null, label:"Sem registro de execução", nivel:"desconhecido" };
  const dt = parseBrDate(data);
  const dias = Math.round((new Date() - dt) / 86400000);
  let label;
  if(dias<=0) label = "hoje";
  else if(dias===1) label = "há 1 dia";
  else if(dias<14) label = `há ${dias} dias`;
  else if(dias<60) label = `há ${Math.round(dias/7)} semanas`;
  else label = `há ${Math.round(dias/30)} meses`;
  let nivel;
  if(dias<21) nivel = "recente";       // tocada há menos de 3 semanas — cuidado pra não repetir
  else if(dias<60) nivel = "morno";    // 3-8 semanas
  else nivel = "seguro";               // 2+ meses, tranquilo repetir
  return { data, dias, label, nivel };
}

const DECORATIVE_RE = /^\(?\d+x\)?$/i;
const CHORD_CORE_RE = /^[A-G](#|b)?[a-zA-Z0-9#\+\-\(\)]*$/;

function parseChordCore(str){
  const m = str.match(/^([A-G])(#|b)?(.*)$/);
  if(!m) return null;
  return {letter:m[1], acc:m[2]||'', suffix:m[3]||''};
}

function transposeNote(letter, acc, semitones, useFlats){
  const idx = NOTE_INDEX[letter+acc];
  if(idx===undefined) return letter+acc;
  const newIdx = ((idx + semitones) % 12 + 12) % 12;
  return useFlats ? NOTES_FLAT[newIdx] : NOTES_SHARP[newIdx];
}

function transposeChordString(chord, semitones, useFlats){
  if(!semitones) return chord;
  const slashIdx = chord.indexOf('/');
  const main = slashIdx>-1 ? chord.slice(0,slashIdx) : chord;
  const bass = slashIdx>-1 ? chord.slice(slashIdx+1) : null;
  const mainParsed = parseChordCore(main);
  if(!mainParsed) return chord;
  let result = transposeNote(mainParsed.letter, mainParsed.acc, semitones, useFlats) + mainParsed.suffix;
  if(bass!==null){
    const bassParsed = parseChordCore(bass);
    result += '/' + (bassParsed ? transposeNote(bassParsed.letter, bassParsed.acc, semitones, useFlats) + bassParsed.suffix : bass);
  }
  return result;
}

function isTransposableToken(tok){
  if(DECORATIVE_RE.test(tok)) return {decorative:true};
  let core = tok, prefix='', suffix='';
  while(core.length && '(['.includes(core[0])){ prefix+=core[0]; core=core.slice(1); }
  while(core.length && ')]'.includes(core[core.length-1])){ suffix = core[core.length-1]+suffix; core = core.slice(0,-1); }
  if(!core.length) return {chord:false};
  const slashIdx = core.indexOf('/');
  const mainCore = slashIdx>-1 ? core.slice(0,slashIdx) : core;
  if(CHORD_CORE_RE.test(mainCore)) return {chord:true, prefix, core, suffix};
  return {chord:false};
}

// Decide se uma linha é "de acordes" (cifra) ou letra/texto livre.
// Extrai também um possível rótulo entre colchetes, ex: "[Intro] D A/C# G"
function classifyLine(line){
  const bracketMatch = line.match(/^(\s*\[[^\]]*\]\s*)(.*)$/);
  const label = bracketMatch ? bracketMatch[1] : '';
  const rest = bracketMatch ? bracketMatch[2] : line;
  const parts = rest.split(/(\s+)/);
  let allValid = true, hasChord = false;
  for(const p of parts){
    if(p.trim()==='') continue;
    const info = isTransposableToken(p);
    if(info.decorative) continue;
    if(info.chord){ hasChord = true; continue; }
    allValid = false; break;
  }
  return { label, parts, isChordish: allValid && hasChord };
}

function transposeLine(line, semitones, useFlats){
  const { label, parts, isChordish } = classifyLine(line);
  if(!isChordish || !semitones) return line;
  const newParts = parts.map(p=>{
    if(p.trim()==='') return p;
    const info = isTransposableToken(p);
    if(info.decorative) return p;
    if(info.chord) return info.prefix + transposeChordString(info.core, semitones, useFlats) + info.suffix;
    return p;
  });
  return label + newParts.join('');
}

function transposeCifra(text, semitones, useFlats){
  if(!semitones) return text;
  return text.split("\n").map(l=>transposeLine(l, semitones, useFlats)).join("\n");
}

// Renderiza cada linha da cifra num bloco próprio, pra dar pra esconder só as linhas
// de acorde (modo "só letra") sem perder rótulos de seção como [Intro]/[Refrão].
function highlightChords(text){
  return text.split("\n").map(line=>{
    const { label, isChordish } = classifyLine(line);
    if(label){
      const rest = line.slice(label.length);
      const restIsChords = isChordish && rest.trim().length>0;
      const restHtml = restIsChords ? `<span class="chord chord-part">${rest}</span>` : rest;
      return `<div class="line"><span class="section-label">${label}</span>${restHtml}</div>`;
    }
    if(isChordish){
      return `<div class="line chord-line"><span class="chord">${line}</span></div>`;
    }
    return `<div class="line">${line.length ? line : ' '}</div>`;
  }).join('');
}

const voices = ["TODAS", ...Array.from(new Set(REPERTORIO.map(r=>vozClass(r[2])))).filter(v=>v!=="OUTROS").sort()];
let activeVoice = "TODAS";

voices.forEach(v=>{
  const chip = document.createElement('div');
  chip.className = 'chip' + (v===activeVoice ? ' active':'');
  chip.textContent = v==="TODAS" ? "Todas" : v;
  chip.dataset.voice = v;
  chip.addEventListener('click', ()=>{
    activeVoice = v;
    filtersEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    render();
  });
  filtersEl.appendChild(chip);
});

// Constrói um card de música reutilizável (usado na lista geral, no repertório da semana e em próximas músicas)
function createSongCard({ num, title, voz, youtube, openByDefault, nota } = {}){
  const key = (title||'').toUpperCase();
  const data = CIFRAS[key];
  const vClass = voz ? vozClass(voz) : null;

  const card = document.createElement('div');
  card.className = 'card';
  if(openByDefault) card.classList.add('open');

  const head = document.createElement('div');
  head.className = 'card-head';
  const uv = ultimaVezInfo(title);
  head.innerHTML = `
    ${num!==undefined ? `<span class="num">${num}</span>` : ''}
    <span class="title">${title}${data ? '' : '<span class="note">cifra ainda não cadastrada</span>'}
      <span class="uv uv-${uv.nivel}">${uv.data ? '🕓 '+uv.label : '— nunca tocada'}</span>
    </span>
    ${data ? `<span class="tom">${data.tom}</span>` : ''}
    ${voz ? `<span class="badge ${vClass}"><span class="dot"></span>${voz}</span>` : ''}
    <span class="chevron">›</span>
  `;
  head.addEventListener('click', ()=>{
    card.classList.toggle('open');
  });

  const body = document.createElement('div');
  body.className = 'card-body';
  const bodyInner = document.createElement('div');
  bodyInner.className = 'card-body-inner';
  const bodyPad = document.createElement('div');
  bodyPad.className = 'body-pad';
  bodyInner.appendChild(bodyPad);
  body.appendChild(bodyInner);

  const youtubeRow = youtube
    ? `<a class="yt-link" href="${youtube}" target="_blank" rel="noopener">▶ Ouvir no YouTube</a>`
    : '';
  const notaRow = nota ? `<div class="mod-row">📝 ${nota}</div>` : '';

  if(data){
    bodyPad.innerHTML = `
      ${youtubeRow}
      ${notaRow}
      <div class="meta-row">
        <span><b>Tom original:</b> ${data.tom}</span>
        <span><b>Compositor:</b> ${data.compositor}</span>
      </div>
      ${data.modulacao ? `<div class="mod-row">🎚️ <b>Troca de tom na música:</b> ${data.modulacao}</div>` : ''}
      <div class="transpose">
        <span>Transpor</span>
        <button class="tr-btn" data-dir="-1" title="Descer meio tom">–</button>
        <span class="tr-tom"></span>
        <button class="tr-btn" data-dir="1" title="Subir meio tom">+</button>
        <button class="tr-reset chip" style="display:none;">voltar ao original</button>
        <button class="tr-fs" title="Ver em tela cheia">⛶ Tela cheia</button>
      </div>
      <div class="cifra"></div>
      <a class="source" href="${data.fonte}" target="_blank" rel="noopener">Ver cifra completa em ${data.fonteNome} ↗</a>
    `;

    let offset = 0;
    const useFlats = (data.tom||'').includes('b');
    const cifraEl = bodyPad.querySelector('.cifra');
    const tomEl = bodyPad.querySelector('.tr-tom');
    const resetBtn = bodyPad.querySelector('.tr-reset');
    const fsBtn = bodyPad.querySelector('.tr-fs');
    const songKey = key;

    function renderTranspose(){
      cifraEl.innerHTML = highlightChords(transposeCifra(data.cifra, offset, useFlats));
      const currentTom = offset===0 ? data.tom : transposeChordString(data.tom, offset, useFlats);
      tomEl.textContent = offset===0 ? currentTom : `${currentTom} (${offset>0?'+':''}${offset} ${Math.abs(offset)===1?'semitom':'semitons'})`;
      resetBtn.style.display = offset===0 ? 'none' : 'inline-block';
      if(fsOpenKey === songKey) syncFullscreen(cifraEl.innerHTML, tomEl.textContent);
    }
    renderTranspose();

    bodyPad.querySelectorAll('.tr-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        offset += parseInt(btn.dataset.dir, 10);
        renderTranspose();
      });
    });
    resetBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      offset = 0;
      renderTranspose();
    });
    fsBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openFullscreen({
        key: songKey,
        title,
        tomText: tomEl.textContent,
        cifraHtml: cifraEl.innerHTML,
        onDec: ()=>{ offset -= 1; renderTranspose(); },
        onInc: ()=>{ offset += 1; renderTranspose(); },
      });
    });
  } else {
    bodyPad.innerHTML = `
      ${youtubeRow}
      ${notaRow}
      <div class="placeholder">Cifra e tom ainda não foram cadastrados para "${title}". Assim que forem definidos, entram aqui automaticamente.</div>
    `;
  }

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function renderSemana(){
  const el = document.getElementById('semana');
  if(!el) return;
  if(!SEMANA || !Array.isArray(SEMANA.musicas) || !SEMANA.musicas.length){
    el.innerHTML = '';
    return;
  }
  const escaladosHtml = (SEMANA.escalados||[]).map(v=>`<span class="badge ${vozClass(v)}"><span class="dot"></span>${v}</span>`).join('');
  el.innerHTML = `
    <div class="semana-head">
      <div>
        <div class="semana-title">🗓️ Repertório da semana</div>
        <div class="semana-date">${SEMANA.diaSemana ? SEMANA.diaSemana + ' · ' : ''}${SEMANA.data || ''}</div>
      </div>
      ${escaladosHtml ? `<div class="semana-escalados">${escaladosHtml}</div>` : ''}
    </div>
    <div class="semana-list"></div>
  `;
  const listWrap = el.querySelector('.semana-list');
  SEMANA.musicas.forEach((m, i)=>{
    if(!m || !m.titulo){
      const ph = document.createElement('div');
      ph.className = 'semana-tbd';
      ph.textContent = `Música ${i+1} — a definir`;
      listWrap.appendChild(ph);
      return;
    }
    listWrap.appendChild(createSongCard({ title: m.titulo, voz: m.voz, youtube: m.youtube }));
  });
}

function render(){
  const q = normalize(searchEl.value);
  listEl.innerHTML = "";
  let shown = 0;

  let entries = REPERTORIO.filter(([num, title, voz])=>{
    const vClass = vozClass(voz);
    if(activeVoice!=="TODAS" && vClass!==activeVoice) return false;
    const matches = !q || normalize(title).includes(q) || normalize(voz).includes(q);
    return matches;
  });

  entries.forEach(([num, title, voz])=>{
    shown++;
    listEl.appendChild(createSongCard({ num, title, voz }));
  });

  countEl.textContent = shown + (shown===1 ? " música encontrada" : " músicas encontradas") + ` · ${Object.keys(CIFRAS).length} com cifra completa de ${REPERTORIO.length} no repertório`;

  if(shown===0){
    listEl.innerHTML = `<div class="empty-state">Nenhuma música encontrada para essa busca.</div>`;
  }
}

// Próximas Músicas: repertório inteiro ordenado pelas que ficaram mais tempo sem tocar
// (nunca tocada = prioridade máxima), pra ajudar a escolher sem repetir à toa.
function renderProximas(){
  listProximasEl.innerHTML = "";
  if(!PROXIMOS_LANCAMENTOS.length){
    countProximasEl.textContent = "Nenhuma música nova cadastrada ainda.";
    listProximasEl.innerHTML = `<div class="empty-state">Quando tiver uma música nova pra ensinar a banda, me manda o nome (e a cifra, se já tiver) que eu coloco aqui.</div>`;
    return;
  }
  PROXIMOS_LANCAMENTOS.forEach(m=>{
    listProximasEl.appendChild(createSongCard({ title: m.titulo, voz: m.voz, youtube: m.youtube, nota: m.nota }));
  });
  countProximasEl.textContent = `${PROXIMOS_LANCAMENTOS.length} música(s) nova(s) a caminho`;
}

searchEl.addEventListener('input', render);
switchTab('semana');
renderSemana();
render();
</script>
